// Spy: Odak ve Ekran Süresi - Google Play sürümü.
//   Derleme:  ./build.sh            (testler + APK + AAB)
//   Android Studio bu klasörü doğrudan proje olarak açabilir.
plugins {
    id 'com.android.application' version '8.13.2'
}

def spyVersionName = '1.4.5'
def spyVersionCode = 10500

android {
    namespace 'com.spyapp.mobile'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.spyapp.mobile'
        minSdk 23
        targetSdk 36
        versionCode spyVersionCode
        versionName spyVersionName
        androidResources { localeFilters += ['en', 'tr'] }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Yükleme anahtarı: SPY_UPLOAD_KEYSTORE / SPY_UPLOAD_ALIAS / SPY_UPLOAD_PASS ortam değişkenleri.
    // Verilmezse paket imzasız üretilir (Play Console'a yüklemek için imzalı olmalı).
    def uploadKs = System.getenv('SPY_UPLOAD_KEYSTORE')
    signingConfigs {
        if (uploadKs) {
            upload {
                storeFile file(uploadKs)
                storePassword System.getenv('SPY_UPLOAD_PASS')
                keyAlias System.getenv('SPY_UPLOAD_ALIAS') ?: 'upload'
                keyPassword System.getenv('SPY_UPLOAD_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadKs) signingConfig signingConfigs.upload
            ndk { debugSymbolLevel 'NONE' }
        }
    }

    bundle {
        // Tüm diller tek pakette kalsın (arayüz dili uygulama içinde seçilir).
        language { enableSplit = false }
    }

    buildFeatures { buildConfig = false }
    lint {
        abortOnError false
        // Geri hareketi OnBackInvokedCallback ile işleniyor (MainActivity.registerBack); onBackPressed yalnızca Android 12 ve altı için.
        disable += ['GestureBackNavigation']
    }
}

dependencies {
    // Play Faturalandırma'nın bağımlılıkları farklı Kotlin sürümleri çekiyor; tek sürüme sabitlenir.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
}

// Gradle'ın ürettikleri build/ içinde; build.sh'ın kendi ara dosyalarıyla karışmasın.
layout.buildDirectory = file('build-gradle')
