<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Spy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Açılış: internet sitesindeki kapalı gözün açılma animasyonu (aynı SVG ve aynı hareket). -->
<div id="splash" aria-hidden="true">
<svg viewBox="0 0 720 360">
<defs>
<linearGradient id="spl-scl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4ff"/><stop offset="1" stop-color="#d7d0fa"/></linearGradient>
<radialGradient id="spl-ring" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#a98bff"/><stop offset="0.6" stop-color="#6d4ff2"/><stop offset="1" stop-color="#4632b8"/></radialGradient>
<radialGradient id="spl-iris" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2a2270"/><stop offset="1" stop-color="#110d33"/></radialGradient>
<clipPath id="spl-clip"><path id="spl-clip-path" d="M40 180 Q360 320 680 180 Q360 320 40 180 Z"/></clipPath>
</defs>
<path id="spl-lid" d="M40 180 Q360 320 680 180 Q360 320 40 180 Z" fill="url(#spl-scl)" stroke="#e9e5ff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<g clip-path="url(#spl-clip)"><g transform="translate(360 180) scale(0.84)">
<circle r="108" fill="#241e62"/>
<circle r="96" fill="url(#spl-ring)"/>
<circle r="82" fill="url(#spl-iris)"/>
<circle r="88" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-dasharray="150 400" transform="rotate(120)"/>
<circle r="42" fill="#0b0827"/>
<circle cx="14" cy="-14" r="14" fill="#ffffff"/>
<circle cx="-20" cy="18" r="4" fill="#ffffff" opacity=".45"/>
</g></g>
</svg>
<div id="splash-word">SPY</div>
</div>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="native.js"></script>
<script src="app.js"></script>
</body>
</html>
